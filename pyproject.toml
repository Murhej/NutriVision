[project]
name = "nutrivision"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
	"torch>=2.0.0",
	"torchvision>=0.15.0",
	"numpy>=1.24.0",
	"pandas>=2.0.0",
	"matplotlib>=3.7.0",
	"tqdm>=4.65.0",
	"pillow>=10.0.0",
	"scikit-learn>=1.3.0",
	"fastapi>=0.104.0",
	"pydantic>=2.0.0",
	"uvicorn[standard]>=0.24.0",
	"python-multipart>=0.0.6",
	"requests>=2.31.0",
	"kagglehub>=0.3.7",
]

[tool.vercel]
entrypoint = "src.api:app"